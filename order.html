{% extends 'vivo/layout/main.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/order.css' %}">

<div class="container mt-5">

    <form method="POST" action="{% url 'place_order' %}">
    {% csrf_token %}

        <div id="orderBox">

            <div>
            <img src="{% static 'images/vivo-v70 51gBpDZ9qAL.-SL1500-.avif'%}" alt="vivo" class="first">
            </div>

            <div class="code">
            <h3>Order Details</h3>

            <label>Name</label>
            <input type="text" name="name" class="form-control" required>

            <label>Email</label>
            <input type="email" name="email" class="form-control" required>

            <label>Phone</label>
            <input type="text" name="phone" class="form-control" required>

            <label>Address</label>
            <input type="text" name="Address" class="form-control" required>

            <label>Quantity</label>
            <input
                type="number" id="qty" name="qty" value="1" min="1" class="form-control" oninput="calculatePrice()">

            <h4 class="mt-3">
                Total Price:
                <span id="total">₹61,999</span>
            </h4>

            <button type="submit" class="btn btn-primary mt-3">
                Place Order
            </button>  
            <div class="out">
            <img src="{% static 'images/fa_9e47c1.png'%}" alt="vivo" class="first2">
            </div>       
            </div>
     </div>
           
    </form>
</div>


<script src="{% static 'js/smartphone.js' %}"></script>

{% endblock %}
